# .github/workflows/docker-publish.yml

name: Docker Build and Publish

# Controls when the workflow will run
on:
  # Triggers the workflow on push events for the main branch
  push:
    branches: [ "main" ]

  # Triggers the workflow on pull request events targeting the main branch
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Define environment variables accessible by all jobs
env:
  REGISTRY: ghcr.io
  # Use the repository name directly. metadata-action will format it.
  # Format will be: owner/repository-name (e.g., aviv926/digital-display-switcher)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest # Use the latest available Ubuntu runner

    # Grant permissions for the GITHUB_TOKEN
    permissions:
      contents: read      # Needed to check out the repository
      packages: write     # Needed to push Docker image to GHCR
      pull-requests: read # Optional: Needed if you want Actions to comment on PRs, etc.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Checks out your repository code

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }} # Typically your GitHub username
          # GITHUB_TOKEN is a special secret automatically available to Actions
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta # Assign an ID to refer to the outputs of this step later
        uses: docker/metadata-action@v5
        with:
          # Provide the base image name. The action will generate lowercase tags.
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Generates tags based on the event:
          # - on push to main: latest, git sha
          # - on pull request: pr-<pr_number>
          # - on workflow_dispatch: manual-<run_id> (or similar, check action docs for specifics)

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Set context to the root directory where Dockerfile is located
          # Push only when the trigger is a push event to the main branch
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }} # Use tags generated by the metadata action
          labels: ${{ steps.meta.outputs.labels }} # Add labels generated by the metadata action
          # Optional: Enable build cache for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
