
services:
  digital-display-switcher:
    container_name: digital-display-switcher
    image: ghcr.io/aviv926/digital-display-switcher:main
    ports:
      - "3000:8000"  # Map port 8080 on the host to port 8000 in the container
    env_file:
      - .env
    restart: unless-stopped



